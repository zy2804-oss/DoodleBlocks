<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bad Volume Controller</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #102a43; background: #f4fbff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(90vw, 460px); text-align: center; }
      h1 { margin-bottom: .25rem; }
      .instructions { color: #486581; }
      #pond {
        width: min(78vw, 330px); aspect-ratio: 1; margin: 2rem auto 1rem;
        position: relative; border-radius: 50%; cursor: crosshair; outline: none;
        background: #d9f2ff; box-shadow: inset 0 0 30px #9cd9ed;
      }
      #pond:focus-visible { box-shadow: 0 0 0 4px #f6ad55, inset 0 0 30px #9cd9ed; }
      .ring { position: absolute; inset: 0; margin: auto; border: 2px solid #2c7da0; border-radius: 50%; pointer-events: none; opacity: .45; }
      .ring:nth-child(1) { width: 20%; height: 20%; }
      .ring:nth-child(2) { width: 40%; height: 40%; }
      .ring:nth-child(3) { width: 60%; height: 60%; }
      .ring:nth-child(4) { width: 80%; height: 80%; }
      .ring:nth-child(5) { width: 100%; height: 100%; }
      #indicator { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #f28c28; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 1px 5px #6b3d0c; transition: left .15s, top .15s; }
      #status { min-height: 1.5rem; font-weight: 700; }
      #hint { min-height: 3rem; color: #486581; }
      button { border: 0; border-radius: .4rem; padding: .65rem .9rem; color: white; background: #176b87; font: inherit; cursor: pointer; }
      button:hover { background: #0f526a; }
      kbd { padding: .1rem .3rem; border: 1px solid #9fb3c8; border-radius: .2rem; background: white; }
    </style>
  </head>
  <body>
    <main>
      <h1>Resonance Dial</h1>
      <p class="instructions">Where should the sound rest?</p>
      <div id="pond" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" tabindex="0">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
        <span id="indicator" aria-hidden="true"></span>
      </div>
      <p id="status" aria-live="polite">Stillness — muted</p>
      <p id="hint">Try the center, then a ring. You can also use <kbd>←</kbd> and <kbd>→</kbd>.</p>
      <button id="toneButton" type="button">Start a test tone</button>
    </main>

    <script>
      const pond = document.querySelector("#pond");
      const indicator = document.querySelector("#indicator");
      const status = document.querySelector("#status");
      const hint = document.querySelector("#hint");
      const toneButton = document.querySelector("#toneButton");
      let volumeLevel = 0;
      let audioContext, oscillator, gain;

      function updateVolume(nextLevel, previousLevel = volumeLevel) {
        volumeLevel = Math.max(0, Math.min(5, nextLevel));
        const percent = volumeLevel * 20;
        pond.setAttribute("aria-valuenow", volumeLevel);
        pond.setAttribute("aria-valuetext", volumeLevel === 0 ? "Muted" : `Ripple ${volumeLevel} of 5`);
        status.textContent = volumeLevel === 0 ? "Stillness — muted" : `Ripple ${volumeLevel} of 5 — ${percent}% volume`;
        gain?.gain.setTargetAtTime(volumeLevel / 5 * 0.08, audioContext.currentTime, 0.02);

        // The dot makes the program's hidden state visible.
        const distance = volumeLevel * 10;
        indicator.style.left = `${50 + distance}%`;
        indicator.style.top = "50%";

        if (volumeLevel > previousLevel) hint.textContent = "The ripples are reaching farther.";
        if (volumeLevel < previousLevel) hint.textContent = "Closer to stillness.";
        if (volumeLevel === 0) hint.textContent = "Still water, silent sound.";
      }

      function chooseRing(event) {
        const box = pond.getBoundingClientRect();
        const x = event.clientX - box.left - box.width / 2;
        const y = event.clientY - box.top - box.height / 2;
        const radius = Math.sqrt(x * x + y * y);
        // The innermost circle is a forgiving mute zone, not one exact pixel.
        const muteZone = box.width / 10;
        updateVolume(radius <= muteZone ? 0 : Math.ceil(radius / muteZone));
      }

      pond.addEventListener("click", chooseRing);
      pond.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "ArrowUp") {
          event.preventDefault();
          updateVolume(volumeLevel + 1);
        }
        if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
          event.preventDefault();
          updateVolume(volumeLevel - 1);
        }
      });

      toneButton.addEventListener("click", () => {
        if (!audioContext) {
          audioContext = new AudioContext();
          oscillator = audioContext.createOscillator();
          gain = audioContext.createGain();
          oscillator.frequency.value = 220;
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start();
          toneButton.textContent = "Stop test tone";
          updateVolume(volumeLevel);
        } else {
          oscillator.stop();
          audioContext.close();
          audioContext = oscillator = gain = null;
          toneButton.textContent = "Start a test tone";
        }
      });

      updateVolume(0);
    </script>
  </body>
</html>
